services:
  postgres:
    image: postgres:17
    container_name: utility-alerts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: utility_admin
      POSTGRES_PASSWORD: utility_password
      POSTGRES_DB: utility_alerts
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: