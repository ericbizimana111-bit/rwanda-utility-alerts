services:
  postgres:
    image: postgres:17
    container_name: utility-alerts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-utility_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-utility_password}
      POSTGRES_DB: ${DATABASE_NAME:-utility_alerts}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-utility_admin} -d ${DATABASE_NAME:-utility_alerts}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: utility-alerts-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: